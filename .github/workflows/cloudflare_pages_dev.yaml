name: Deploy develop to Cloudflare Pages

# develop answers at https://dev.bb.cz0.cz, so that a change to the page, to the
# prompt or to an install command can be tried from a real browser and a real shell
# before it is merged to main. main keeps answering at betterbash.cz0.cz from GitHub
# Pages (pages_deploy.yaml); what differs between the two is the host, not the
# artifact: the same page and the same staged bb.tgz are built here as there.
#
# The Pages project and its custom domain are provisioned by
# deploy/cloudflare-pages.mjs, so the only setup this workflow needs is its two
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: webpage/frontend/pnpm-lock.yaml

      - name: Install WebUI dependencies
        working-directory: webpage/frontend
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        # Cloudflare Pages serves a site at the root of its own domain, so the base
        # is the root. The commands of this page still fetch from the origin that
        # served it - which here is dev.bb.cz0.cz itself, exactly as production
        # installs from betterbash.cz0.cz - so the bundle is built in production
        # mode and only says where it stands: VITE_BB_ENV gives the page the badge
        # of a development deployment, and VITE_BB_RELEASE_REF pins the git command
        # to develop instead of to the tag of a release that has not happened.
        working-directory: webpage/frontend
        env:
          VITE_BB_ENV: development
          VITE_BB_RELEASE_REF: develop
        run: pnpm build --base=/

      - name: Stage the files an install command fetches
        # The payload is published as bb.tgz, which contains exactly the prompt
        # files and the installer and uninstaller of them; the same files are
        # staged loose as well, for the legacy getbb.sh path.
        run: |
          ./tests/stage-downloads.sh webpage/frontend/dist
          tar -tzf webpage/frontend/dist/bb.tgz

      - name: Check the payload of the deployment
        run: ./tests/check-deployment-payload.sh webpage/frontend/dist

      - name: Remember the checksum of this package
        id: package
        # The smoke job waits for the domain to serve this very checksum, so it
        # cannot mistake an older deployment - or the edge cache - for this one.
        run: echo "sha=$(awk '{print $1}' webpage/frontend/dist/bb.tgz.sha256)" >>"$GITHUB_OUTPUT"

      - name: Check the Pages project and its custom domain
        # Creates the Pages project, its production branch and its custom domain
        # when they do not exist yet, and reports what already answers the host when
        # something else does. Idempotent, so every push checks itself.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/cloudflare-pages.mjs ensure

      - name: Upload the deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy webpage/frontend/dist --project-name=betterbash-dev --branch=develop

  smoke:
    # What was built is not what answers until Cloudflare has propagated the
    # deployment, so this job installs from the domain rather than from the
    # artifact, and runs both install paths of the page against it.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the domain to serve this deployment
        run: |
          set -euo pipefail
          want='${{ needs.build.outputs.package_sha }}'
          for _ in $(seq 1 40); do
            served=$(curl -fsSL -o - https://dev.bb.cz0.cz/bb.tgz.sha256 2>/dev/null | awk '{print $1}' || true)
            if [ "$served" = "$want" ]; then
              echo "serving $served"
              exit 0
            fi
            echo "serving '${served:-nothing}', want $want"
            sleep 15
          done
          echo "https://dev.bb.cz0.cz did not serve this package in 10 minutes" >&2
          exit 1

      - name: Check what the deployment serves
        run: |
          set -euo pipefail
          # A leading dot in a path is served as any other name; the installer
          # appends this block to ~/.inputrc, so it has to be reachable.
          for path in .inputrc bb.tgz bb.tgz.sha256 getbb.sh; do
            code=$(curl -fsSL -o /dev/null -w '%{http_code}' "https://dev.bb.cz0.cz/$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Run the installation tests against the deployment
        run: ./test-install.sh --live https://dev.bb.cz0.cz --code vN-y_5uA

      - name: Run the legacy install path tests against the deployment
        run: ./tests/test-legacy-pipe.sh --live https://dev.bb.cz0.cz --code vN-y_5uA
