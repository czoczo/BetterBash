name: Test development environment

# Everything that has to work locally also has to work in CI: the shell scripts
# that make BetterBash (lint, theme library, installation methods against a
# staging of this working copy) and the WebUI builds of both modes.

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dash and shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dash shellcheck

      - name: shellcheck, and a bashism has to be reported
        run: ./tests/test-shellcheck.sh

      - name: Theme library under dash
        run: dash tests/test-theme.sh

      - name: Theme library under bash
        run: bash tests/test-theme.sh

      - name: The golden fixture is still what the retired backend produced
        run: sh tests/test-theme.sh --quick

  installation-methods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: curl, wget and openssl install and uninstall a staging of this checkout
        run: ./test-install-methods.sh --code vN-y_5uA --shell 'sh bash dash'

  webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'webpage/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: webpage/frontend

      - name: Build for production
        run: pnpm build
        working-directory: webpage/frontend

      - name: Production bundle must carry the published download origin only
        run: |
          grep -q "betterbash.cz0.cz" dist/assets/*.js
          if grep -q "localhost" dist/assets/*.js; then
            echo "a production bundle points at localhost"
            exit 1
          fi
        working-directory: webpage/frontend

      - name: Build for development
        run: pnpm build:dev
        working-directory: webpage/frontend

      # The local origin has to be in there, that is the point of the mode. The
      # production origin cannot be grepped out of the bundle: it is the fallback
      # for a page that cannot know its own origin, so it is compiled into both.
      - name: Development bundle must carry the local download origin
        run: |
          grep -q "localhost:5173" dist/assets/*.js
          grep -q "localhost:8443" dist/assets/*.js
        working-directory: webpage/frontend
